<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>widget-runtime dev page</title>
<link rel="icon" href="data:,">
<style>
  body { margin: 0; background: #222 linear-gradient(135deg, #334, #223); color: #fff; font: 14px sans-serif }
  main { display: flex; flex-wrap: wrap; gap: 24px; padding: 20px }
  section { width: 640px }
  h2 { margin: 0 0 6px; font-size: 14px; font-weight: 600 }
  .box { width: 640px }
  button { margin: 6px 6px 0 0 }
  .err { color: #ff8a8a; font-size: 12px; white-space: pre-wrap }
</style>
</head>
<body>
<main id="main"></main>
<script type="module">
  // The host and the frame from this package, widgets from the WIDGETS
  // folder (see vite.dev.config.ts). ?w=a,b,c picks the widgets.
  import { mount, defaultTheme } from '../src/host/index.ts'
  const ids = (new URLSearchParams(location.search).get('w') ?? 'crostream.alert').split(',').filter(Boolean)
  const main = document.getElementById('main')
  const ready = []
  window.handles = {}
  window.errors = []
  for (const id of ids) {
    const pkg = await (await fetch('/pkg/' + encodeURIComponent(id))).json()
    const sec = document.createElement('section')
    sec.innerHTML = `<h2></h2><div class="box"></div><div><button>Play</button></div><div class="err"></div>`
    sec.querySelector('h2').textContent = `${pkg.name ?? id} (${id})`
    main.append(sec)
    const h = mount(sec.querySelector('.box'), pkg, { frameUrl: '/widget-frame.html', theme: defaultTheme })
    h.on('error', (e) => {
      window.errors.push({ id, ...e })
      sec.querySelector('.err').textContent += JSON.stringify(e) + '\n'
      console.log('WIDGET ERROR', id, JSON.stringify(e))
    })
    ready.push(new Promise((r) => h.on('ready', r)))
    sec.querySelector('button').onclick = () => h.play(undefined, { sound: false })
    window.handles[id] = h
  }
  await Promise.all(ready)
  window.ready = true
</script>
</body>
</html>
